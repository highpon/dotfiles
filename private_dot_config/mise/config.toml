# Versions are pinned so Renovate can open update PRs.
[tools]
"aqua:anomalyco/opencode" = "1.18.32"
"aqua:anthropics/claude-code" = "2.1.280"
"aqua:google-antigravity/antigravity-cli" = "1.2.9"
"aqua:bitwarden/clients" = "2026.9.0"
"aqua:modem-dev/hunk" = "0.22.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"
fzf = "0.74.4"
github-cli = "2.101.0"
go = "1.27.1"
jq = "1.8.2"
kind = "0.33.0"
krew = "0.5.0"
kubectl = "1.37.0"
neovim = "0.12.5"
node = "26.10.0"
rust = "1.98.1"

# Orca desktop app (https://github.com/stablyai/orca).
# Linux uses the AppImage; macOS uses the .app bundle from the zip.
[tools."github:stablyai/orca"]
version = "1.4.209"

[tools."github:stablyai/orca".platforms]
linux-x64 = { asset_pattern = "orca-linux.AppImage", bin = "orca" }
linux-arm64 = { asset_pattern = "orca-linux-arm64.AppImage", bin = "orca" }
macos-x64 = { asset_pattern = "Orca-{{ version }}-mac.zip", bin_path = "Orca.app/Contents/MacOS", filter_bins = ["Orca"] }
macos-arm64 = { asset_pattern = "Orca-{{ version }}-arm64-mac.zip", bin_path = "Orca.app/Contents/MacOS", filter_bins = ["Orca"] }

# Google Antigravity 2.0 desktop app (Linux only; macOS uses the Homebrew cask).
# Not in the aqua registry, so it is downloaded from Google's bucket. The
# version is "<version>-<build>" as used in the download path.
# Nothing is put on PATH (bin_path points at a directory that does not exist):
# `antigravity` is the CLI's binary, and the app's helper binaries must not
# shadow anything. The app is started from its desktop entry.
# renovate: datasource=custom.antigravity depName=antigravity
[tools."http:antigravity"]
version = "2.17.0-5217732355031040"
os = ["linux"]
strip_components = 1
bin_path = "bin"

[tools."http:antigravity".platforms]
linux-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-hub/{{version}}/linux-x64/Antigravity.tar.gz" }
linux-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-hub/{{version}}/linux-arm/Antigravity.tar.gz" }

# npiperelay (https://github.com/albertony/npiperelay), a Windows binary run
# from WSL. It relays the Windows Bitwarden SSH agent into WSL (see
# ~/.config/systemd/user/bitwarden-ssh-agent-relay.socket).
[tools."github:albertony/npiperelay"]
version = "1.12.1"
os = ["linux"]

[tools."github:albertony/npiperelay".platforms]
linux-x64 = { asset_pattern = "npiperelay_windows_amd64.exe", bin = "npiperelay.exe" }
